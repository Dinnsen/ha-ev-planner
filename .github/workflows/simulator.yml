name: Simulator

# Runs nights through EV Planner minute by minute (see sim/). A broken rule
# fails the run. The same nights then run on 2.0.1 for comparison, and the
# figures for both go in the run's summary.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt pytest-xdist

      - name: Real nights
        # Kept out of the repository: a secret with the nights as a gzipped tar, base64.
        env:
          NIGHTS: ${{ secrets.SIM_PRIVATE_NIGHTS }}
        run: |
          if [ -n "$NIGHTS" ]; then
            mkdir -p "$RUNNER_TEMP/nights"
            echo "$NIGHTS" | base64 -d | tar -xz -C "$RUNNER_TEMP/nights"
            echo "SIM_NIGHTS=$RUNNER_TEMP/nights" >> "$GITHUB_ENV"
            echo "Real nights: $(ls "$RUNNER_TEMP/nights" | wc -l)"
          fi

      - name: This version
        id: current
        continue-on-error: true
        run: |
          set -o pipefail
          version=$(python3 -c "import json; print(json.load(open('custom_components/ev_household_planner/manifest.json'))['version'])")
          SIM_VERSION="$version ($(git rev-parse --short HEAD))" SIM_OUT="$RUNNER_TEMP/current.jsonl" \
            pytest sim -n 4 -p no:cacheprovider -q --tb=line -rf 2>&1 | tail -60

      - name: 2.0.1, for comparison
        if: ${{ !cancelled() }}
        run: |
          rm -rf custom_components
          git checkout v2.0.1 -- custom_components
          SIM_VERSION=2.0.1 SIM_REPORT_ONLY=1 SIM_OUT="$RUNNER_TEMP/v201.jsonl" pytest sim -n 4 -p no:cacheprovider -q --tb=line 2>&1 | tail -5 || true
          rm -rf custom_components
          git checkout HEAD -- custom_components

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          files="$RUNNER_TEMP/current.jsonl"
          [ -f "$RUNNER_TEMP/v201.jsonl" ] && files="$files $RUNNER_TEMP/v201.jsonl"
          python -m sim.report $files | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail on a broken rule
        if: ${{ steps.current.outcome == 'failure' }}
        run: exit 1
