name: Frontend

# The panel and the dashboard cards in a real browser (Chromium, through Playwright):
# every page with every fixture, what the buttons send, the house's picture and the cards.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    # Playwright's own image, with Chromium and what it needs: the version package.json names.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # With a lock file the exact versions in it; without one, the version package.json names.
      - name: Install Playwright
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Run the frontend tests
        run: npm test

      - name: Upload pictures of what failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failures
          path: tests_frontend/failures/*.png
          if-no-files-found: ignore
