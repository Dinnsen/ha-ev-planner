recalculate:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ev_household_planner
set_mode:
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: ev_household_planner
    mode:
      required: true
      selector:
        select:
          translation_key: mode
          options:
            - smart
            - charge_now
            - pause
            - "off"
set_trip:
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: ev_household_planner
    trip:
      required: true
      selector:
        select:
          translation_key: trip
          options:
            - morning
            - midday
            - evening
            - afternoon
            - tomorrow_afternoon
            - weekend
            - holiday
            - week
    date:
      selector:
        date:
    target:
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
climate:
  fields:
    vehicle:
      required: true
      selector:
        device:
          integration: ev_household_planner
    "on":
      default: true
      selector:
        boolean:
    temperature:
      selector:
        number:
          min: 10
          max: 32
          step: 0.5
          unit_of_measurement: "°C"
guest_lookup:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ev_household_planner
guest_plan:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ev_household_planner
guest_charge_now:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ev_household_planner
guest_stop:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ev_household_planner
new_guest:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: ev_household_planner
